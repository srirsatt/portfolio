<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Jev UI change check</title>
  <desc id="description">Two login form wireframes show a button renamed from Log in to Sign in. Playwright captures the before and after states. Their accessibility diff and the original prompt go to Jev for advisory checks of intent, unexpected changes, and regressions.</desc>
  <rect width="960" height="540" fill="white"/>
  <g stroke="#222" stroke-width="2" stroke-linejoin="miter">
    <rect x="72" y="100" width="296" height="216"/>
    <rect x="592" y="100" width="296" height="216"/>
    <rect x="96" y="224" width="148" height="48"/>
    <rect x="616" y="224" width="148" height="48"/>
    <path d="M392 208H568M558 202L568 208L558 214"/>
    <path d="M220 316V350H740V316M280 350V376M274 366L280 376L286 366"/>
    <path d="M430 452H610M600 446L610 452L600 458"/>
  </g>
  <g stroke="#999" stroke-width="1.5">
    <rect x="96" y="162" width="248" height="40"/>
    <rect x="616" y="162" width="248" height="40"/>
  </g>
  <g fill="#222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g font-size="22">
      <text x="72" y="78">before</text>
      <text x="592" y="78">after</text>
      <text x="96" y="140">Login</text>
      <text x="616" y="140">Login</text>
      <text x="170" y="255" text-anchor="middle">Log in</text>
      <text x="690" y="255" text-anchor="middle">Sign in</text>
    </g>
    <g fill="#666" font-size="20">
      <text x="112" y="189">email</text>
      <text x="632" y="189">email</text>
      <text x="480" y="186" text-anchor="middle">edit</text>
      <text x="72" y="406">accessibility diff</text>
      <text x="520" y="428" text-anchor="middle">+ prompt</text>
    </g>
    <g font-size="24">
      <text x="72" y="442">− button "Log in"</text>
      <text x="72" y="478">+ button "Sign in"</text>
      <text x="756" y="449" text-anchor="middle">Jev advisory</text>
    </g>
    <g fill="#666" font-size="19" text-anchor="middle">
      <text x="756" y="478">intent · changes</text>
      <text x="756" y="504">regressions</text>
    </g>
  </g>
</svg>
